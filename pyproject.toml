[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openconstraint"
version = "0.2.0b0"
description = "Deterministic, CI-native SDC constraint-quality auditing and structural coverage"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "ajayasai"}]
keywords = ["eda", "sdc", "static-timing-analysis", "opensta", "verilog", "sarif", "lint"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "hypothesis>=6.167.1",
  "jsonschema>=4.23",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "twine>=6.1",
]
fuzz = [
  "atheris>=3.0,<4; sys_platform == 'linux' and platform_python_implementation == 'CPython'",
]

[project.scripts]
openconstraint = "openconstraint.cli:main"

[project.urls]
Homepage = "https://github.com/ajayasai/OpenConstraint"
Documentation = "https://github.com/ajayasai/OpenConstraint/tree/main/docs"
Issues = "https://github.com/ajayasai/OpenConstraint/issues"
Source = "https://github.com/ajayasai/OpenConstraint"
"Live dashboard" = "https://ajayasai.github.io/OpenConstraint/"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstraint = ["schemas/*.json", "demo/*.v", "demo/*.lib", "demo/*.sdc"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["openconstraint"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["openconstraint"]
