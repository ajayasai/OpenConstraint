name: Deliver verified OpenConstraint upgrade

on:
  push:
    branches: ["feat/proof-carrying-exceptions"]
    paths: [".github/workflows/deliver-verified-upgrade.yml"]

permissions:
  contents: write

concurrency:
  group: deliver-openconstraint-upgrade
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Verify and apply exact tested changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import lzma
          import subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.oc-delivery/{i:02d}.b64').read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '55967ca4ffe3a072b47ec1e4df21543cb3c709f807159d730336a9d87cb7be52'
          # The workflow was already authored by the authorized repository connector.
          # Keep it unchanged; the runner token only delivers product source.
          subprocess.run(['git', 'apply', '--check', '--exclude=.github/workflows/functional.yml', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--exclude=.github/workflows/functional.yml', '-'], input=patch, check=True)
          for path in (
              '.github/final-proof-review-fixes.ready',
              '.github/scripts/apply_final_proof_review_fixes.py',
              '.github/workflows/apply-final-proof-review-fixes.yml',
              '.github/workflows/deliver-verified-upgrade.yml',
              *[f'.oc-delivery/{i:02d}.b64' for i in range(4)],
          ):
              Path(path).unlink()
          subprocess.run(['git', 'add', '--all'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == 'ee99351d6d6407124d1c4c5f9d15eb41627bf57e', tree
          PY
      - name: Validate the complete clean tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev,formal]'
          ruff check .
          ruff format --check .
          mypy src/openconstraint
          pytest --cov=openconstraint --cov-branch --cov-report=term-missing
          python -m build
          python -m twine check dist/*
          git diff --check
          git add --all
          test "$(git write-tree)" = ee99351d6d6407124d1c4c5f9d15eb41627bf57e
      - name: Commit tested upgrade and remove all delivery machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ajayasai
          git config user.email ajayasai@users.noreply.github.com
          git commit --signoff -m 'feat: add independently replayable Boolean influence evidence and harden structural repairs'
          git push origin "HEAD:${GITHUB_REF_NAME}"
