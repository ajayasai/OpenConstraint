name: Clean connector routing probe

on:
  push:
    branches: [feat/adoption-experience]

permissions:
  contents: write

jobs:
  clean:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/adoption-experience
          fetch-depth: 0

      - name: Remove temporary probe and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f THIS_IS_A_TOOL_ROUTING_ERROR
          rm -f .github/workflows/cleanup-routing-probe.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "chore: remove connector routing probe" \
            -m "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin HEAD:feat/adoption-experience
