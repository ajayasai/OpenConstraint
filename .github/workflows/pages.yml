name: Live dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Package static dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare static dashboard
        run: |
          mkdir -p _site/schemas _site/benchmarks/overlays
          cp examples/tiny/expected-modes/openconstraint-report.html _site/index.html
          cp examples/tiny/expected-broken/openconstraint-report.html _site/broken.html
          cp src/openconstraint/schemas/openconstraint-report.schema.json _site/schemas/openconstraint-report.schema.json
          cp benchmarks/manifest.json benchmarks/baseline.json _site/benchmarks/
          cp benchmarks/overlays/*.sdc _site/benchmarks/overlays/
          cp benchmarks/schemas/manifest.schema.json _site/schemas/benchmark-manifest.schema.json
          cp benchmarks/schemas/fetch.schema.json _site/schemas/benchmark-fetch.schema.json
          cp benchmarks/schemas/result.schema.json _site/schemas/benchmark-result.schema.json
          cp benchmarks/schemas/baseline.schema.json _site/schemas/benchmark-baseline.schema.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy live dashboard
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
