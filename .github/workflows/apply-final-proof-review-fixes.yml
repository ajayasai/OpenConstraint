name: Export development snapshot

on:
  push:
    branches: ["feat/proof-carrying-exceptions"]
    paths: [".github/workflows/apply-final-proof-review-fixes.yml"]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Prepare source and offline test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oc-export/wheels
          git ls-files -z | tar --null -T - -cf /tmp/oc-export/source.tar
          python -m pip download --only-binary=:all: --dest /tmp/oc-export/wheels pytest pytest-cov hypothesis jsonschema ruff mypy build twine setuptools z3-solver
          git rev-parse HEAD > /tmp/oc-export/commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openconstraint-development-snapshot
          path: /tmp/oc-export/
          if-no-files-found: error
          retention-days: 3
