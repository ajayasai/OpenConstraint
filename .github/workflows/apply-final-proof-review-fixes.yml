name: Apply final proof review fixes

on:
  push:
    branches:
      - "feat/proof-carrying-exceptions"
    paths:
      - ".github/final-proof-review-fixes.ready"

permissions:
  contents: write

concurrency:
  group: final-proof-review-fixes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and validate final review fixes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Apply reviewed fixes
        run: python .github/scripts/apply_final_proof_review_fixes.py

      - name: Remove temporary patch machinery
        run: rm -f .github/final-proof-review-fixes.ready .github/scripts/apply_final_proof_review_fixes.py .github/workflows/apply-final-proof-review-fixes.yml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate complete repository
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check --fix src/openconstraint/proof.py tests/test_proof.py
          ruff format src/openconstraint/proof.py tests/test_proof.py
          ruff check .
          ruff format --check .
          mypy src/openconstraint
          pytest --cov=openconstraint --cov-branch --cov-report=term-missing
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import json
          from importlib.resources import files
          from jsonschema import Draft202012Validator

          for name in (
              "openconstraint-proof.schema.json",
              "openconstraint-repair.schema.json",
          ):
              schema = json.loads((files("openconstraint.schemas") / name).read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
          PY
          git diff --check

      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ajayasai"
          git config user.email "ajayasai@users.noreply.github.com"
          git add --all
          git commit --signoff -m "fix: harden proof clock and multicycle repairs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
